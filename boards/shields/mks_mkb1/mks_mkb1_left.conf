# ====================================================================
# 1. 基本設定 & 無線分割キーボード制御
# ====================================================================
# キーボードの名前を設定（Bluetoothペアリング時に表示されます）
CONFIG_ZMK_KEYBOARD_NAME="MKS_MKB1"

# 分割キーボードの通信を有効化
CONFIG_ZMK_SPLIT=y

# この端末（左手）を中央親機（Central）として設定
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y


# ====================================================================
# 2. パワーマネジメント（省電力・バッテリー）設定
# ====================================================================
# スリープ状態（省電力モード）への移行を有効化
CONFIG_ZMK_SLEEP=y

# 15分（900,000ミリ秒）入力がない場合、ディープスリープに移行
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# バッテリー残量報告機能を有効化（XIAO BLEの電圧監視用）
CONFIG_ZMK_BATTERY_REPORTING=y


# ====================================================================
# 3. RGB LED (SK6805) & 5V昇圧制御の設定
# ====================================================================
# ZMK標準のRGBアンダーグロウ機能を有効化
CONFIG_ZMK_RGB_UNDERGLOW=y

# WS2812/SK6805制御用ドライバの有効化
CONFIG_WS2812_STRIP=y

# アイドル時（デフォルト5分入力なし）にLEDを自動消灯してバッテリーを保護
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# USB接続が切れた（無線バッテリー駆動になった）際もLED自体の動作は許可
# (※回路側のD7昇圧ピン制御と連動させるための前提フラグ)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# 起動時のデフォルトのLEDエフェクト（0: ソリッド / 固定色など）
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0


# ====================================================================
# 4. ポインティングデバイス (IQS7211E トラックパッド) の設定
# ====================================================================
# ZMKのマウス・ポインティング入力コア機能を有効化
CONFIG_ZMK_POINTING=y

# I2Cバスおよび外部デバイス（ドライバ）通信を有効化
CONFIG_I2C=y

# IQS7211E専用カスタムドライバの有効化（インポートしたドライバ名に依存）
CONFIG_IQS7211E=y