# ====================================================================
# 1. 基本設定 & 無線分割キーボード制御
# ====================================================================
# キーボードの名前を設定（左手側と一致させます）
CONFIG_ZMK_KEYBOARD_NAME="MKS_MKB1"

# 分割キーボードの通信を有効化
CONFIG_ZMK_SPLIT=y

# この端末（右手）を周辺子機（Peripheral）として設定
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n


# ====================================================================
# 2. パワーマネジメント（省電力・バッテリー）設定
# ====================================================================
# スリープ状態（省電力モード）への移行を有効化
CONFIG_ZMK_SLEEP=y

# 15分（900,000ミリ秒）入力がない場合、ディープスリープに移行
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# バッテリー残量報告機能を有効化（右手側のバッテリー単体を監視）
CONFIG_ZMK_BATTERY_REPORTING=y


# ====================================================================
# 3. RGB LED (SK6805) の同期設定
# ====================================================================
# ZMK標準のRGBアンダーグロウ機能を有効化（中央機からの同期信号を受け取ります）
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y


# ====================================================================
# 4. ポインティングデバイス (IQS7211E トラックパッド) の同期設定
# ====================================================================
# 右手側にもトラックパッドが搭載されているため、ドライバとI2Cを有効化
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_IQS7211E=y
