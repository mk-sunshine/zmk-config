# ====================================================================
# 1. 基本設定 & 無線分割キーボード制御
# ====================================================================
# キーボードの名前を設定（左手側と一致させます）
CONFIG_ZMK_KEYBOARD_NAME="MKS_MKB1"

# 分割キーボードの通信を有効化
CONFIG_ZMK_SPLIT=y

# この端末（右手）を周辺子機（Peripheral）として設定
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n


# ====================================================================
# 2. パワーマネジメント（省電力・バッテリー）設定
# ====================================================================
# スリープ状態（省電力モード）への移行を有効化
CONFIG_ZMK_SLEEP=y

# 15分（900,000ミリ秒）入力がない場合、ディープスリープに移行
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# バッテリー残量報告機能を有効化（右手側のバッテリー単体を監視）
CONFIG_ZMK_BATTERY_REPORTING=y


CONFIG_SPI=y
CONFIG_GPIO_595=y
