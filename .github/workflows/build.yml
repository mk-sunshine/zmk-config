name: Build MKS_MKB1 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  notify:
    needs: build
    if: needs.build.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Send build success email
        env:
          SMTP_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          EMAIL_TO: mk.sunshine.1980@gmail.com
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_APP_PASSWORD"].replace(" ", "")
          if not username or not password:
              raise RuntimeError("Set the MAIL_USERNAME and MAIL_APP_PASSWORD repository secrets.")

          message = EmailMessage()
          message["Subject"] = f"GitHub Actions build succeeded: {os.environ['REPOSITORY']}"
          message["From"] = username
          message["To"] = os.environ["EMAIL_TO"]
          message.set_content(
              f"Build succeeded for {os.environ['REPOSITORY']} ({os.environ['BRANCH']}).\n"
              f"Run details: {os.environ['RUN_URL']}\n"
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(username, password)
              server.send_message(message)
          PY
